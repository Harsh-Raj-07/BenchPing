yaml
name: Auto Generate and Upload Files
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:    # Allows manual triggering from the GitHub UI

permissions:
  contents: write       # Grants permission to push files to the repo

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run script to generate/modify files
        run: |
          # Replace this line with your actual script (e.g., python update_data.py)
          echo "Updated on $(date)" > status.txt

      - name: Commit and push files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Automated file upload" || exit 0
          git push
